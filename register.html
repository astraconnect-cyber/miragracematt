<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Miragracematt</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">Miragracematt</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<main class="form-container">

  <div class="form-card">

    <h1>Create Customer Account</h1>

    <p>
      Create your Miragracematt account to apply for a phone
      and manage your weekly payments.
    </p>

    <form id="registerForm">

      <label for="fullName">Full Name</label>
      <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="08012345678"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a strong password"
        minlength="8"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="8"
        required
      >

      <button type="submit">
        Create Account
      </button>

    </form>

    <p id="message"></p>

    <p class="form-footer">
      Already have an account?
      <a href="login.html">Login here</a>
    </p>

  </div>

</main>

<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>

<script>

  const firebaseApp = firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.firestore();

  const registerForm = document.getElementById("registerForm");
  const message = document.getElementById("message");

  registerForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const fullName =
      document.getElementById("fullName").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {

      message.textContent =
        "Passwords do not match.";

      return;
    }

    if (password.length < 8) {

      message.textContent =
        "Password must be at least 8 characters.";

      return;
    }

    message.textContent =
      "Creating your account...";

    try {

      const userCredential =
        await auth.createUserWithEmailAndPassword(
          email,
          password
        );

      const user = userCredential.user;

      await db.collection("customers")
        .doc(user.uid)
        .set({

          uid: user.uid,

          fullName: fullName,

          phone: phone,

          email: email,

          role: "customer",

          accountStatus: "active",

          applicationStatus: "not_started",

          financingStatus: "none",

          createdAt:
            firebase.firestore.FieldValue.serverTimestamp()

        });

      message.textContent =
        "Account created successfully!";

      setTimeout(function() {

        window.location.href =
          "customer-dashboard.html";

      }, 1000);

    } catch (error) {

      console.error(error);

      if (error.code === "auth/email-already-in-use") {

        message.textContent =
          "This email is already registered.";

      } else if (error.code === "auth/weak-password") {

        message.textContent =
          "Please choose a stronger password.";

      } else {

        message.textContent =
          "Registration failed. Please try again.";

      }

    }

  });

</script>

</body>
</html>
